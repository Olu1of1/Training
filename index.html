EX.stepup = {"n":"Dumbbell step-up","m":"Quads, glutes, single-leg strength","s":"3×8 / leg","sets":3,"rest":"90 s","eq":"Knee-height box or bench, dumbbells","cap":["Foot on box","Standing on box"],"cues":["Stand facing a box about knee height with a dumbbell in each hand. Put your whole foot on the box.","Press through the heel of the front foot and stand tall. Do not push off the back foot.","Bring the back knee up to hip height at the top, then control it back down.","Lower slowly over 3 seconds. Finish all reps on one leg before you switch."],"bad":["Pushing off the floor foot. Keep the back foot light and use the front leg.","Leaning forward over the box. Stay tall with ribs down.","Box too high. Your hip should not drop below your knee at the start."],"A":{"m":"f","x":160,"y":147,"sh":-30,"th":80,"t":14,"l2":{"ik":[124,185],"dir":1,"fo":0}},"M":{"m":"f","x":160,"y":147,"sh":-15,"th":40,"t":8,"l2":{"ik":[140,142],"dir":1,"fo":0}},"B":{"m":"f","x":160,"y":147,"sh":0,"th":0,"t":0,"l2":{"ik":[188,128],"dir":1,"fo":0}},"fur":[{"t":"rect","x":140,"y":147,"w":62,"h":40}],"mov":[{"t":"dbl","at":"wr"}],"w":{"ref":"squat","f":0.2,"u":"hand","step":2,"inc":2,"note":"Per hand. Start with half of this if balance feels shaky. A lower box is fine."}};
EX.sldl = {"n":"Single-leg Romanian deadlift","m":"Hamstrings, glutes, balance","s":"3×8 / leg","sets":3,"rest":"75 s","eq":"One dumbbell or kettlebell","cap":["Standing","Hinged"],"cues":["Stand on one leg with a soft knee. Hold the weight in the hand opposite your standing leg.","Hinge forward at the hip while the back leg lifts behind you, like a seesaw. Your torso and back leg move together.","Keep your hips square to the floor. Stop when your torso is about level or your hamstring stretches hard.","Squeeze your glute and stand tall. Finish all reps on one leg, then switch."],"bad":["Opening your hips up toward the side. Keep your belt line facing the floor.","Rounding your back. Shorten the range.","Locking your standing knee. Keep a soft bend."],"A":{"m":"f","x":120,"sh":-3,"th":3,"t":0,"ua":0,"fa":0,"l2":{"th":-5,"sh":-15,"fo":0}},"B":{"m":"f","x":120,"sh":-3,"th":3,"t":80,"ua":0,"fa":0,"l2":{"th":-80,"sh":-80,"fo":0}},"mov":[{"t":"db","at":"wr","r":8,"oy":8}],"w":{"ref":"dl","f":0.2,"u":"hand","step":2,"inc":2,"note":"One dumbbell. Balance is the limit at first, so start light and hold something with your free hand if needed."}};
EX.pullthrough = {"n":"Cable pull-through","m":"Glutes, hamstrings, hip hinge","s":"3×12","sets":3,"rest":"75 s","eq":"Low cable with a rope","cap":["Standing tall","Hinged"],"cues":["Face away from the cable with the rope between your legs. Step forward until the cable is tight.","Push your hips straight back and let the rope travel behind you. Knees stay soft, back stays flat.","Stop when your hamstrings stretch, usually when your torso is near 60° from vertical.","Drive your hips forward and squeeze your glutes. Finish tall with your ribs down."],"bad":["Squatting down. This is a hip hinge, so the knees barely bend.","Leaning back at the top and pushing the belly forward. That is the lordosis pattern. Stop at standing tall.","Pulling with your arms. They only hold the rope."],"A":{"m":"f","x":120,"ua":10,"fa":20},"B":{"m":"f","x":120,"t":62,"th":26,"sh":-4,"ua":-22,"fa":-18},"fur":[{"t":"rect","x":26,"y":150,"w":12,"h":37}],"mov":[{"t":"cable","at":"wr","to":[32,178]}],"w":{"ref":"bw","f":0.35,"u":"total","step":2.5,"inc":2.5,"note":"Machine stack. Brands label stacks differently, so judge by feel. This is a glute move, so go for a clean squeeze."}};
EX.ezcurl = {"n":"EZ-bar curl","m":"Biceps, forearms","s":"3×10","sets":3,"rest":"60 s","eq":"EZ bar","cap":["Arms down","Curled"],"cues":["Stand tall, hands on the angled grips, elbows pinned to your sides.","Curl the bar up in an arc toward your shoulders. Your elbows stay put.","Squeeze your biceps at the top for 1 second.","Lower over 3 seconds until your arms are fully straight."],"bad":["Swinging your hips and leaning back. If you do, the bar is too heavy.","Elbows drifting forward. Pin them to your ribs."],"A":{"m":"f","x":120},"B":{"m":"f","x":120,"fa":155},"mov":[{"t":"plate","at":"wr","r":10}],"w":{"f":0.2,"u":"total","step":2.5,"note":"Total including the EZ bar, which weighs about 8 to 10 kg."}};
EX.hammer = {"n":"Hammer curl","m":"Biceps, brachialis, forearms","s":"3×10","sets":3,"rest":"60 s","eq":"Dumbbells","cap":["Arms down","Curled"],"cues":["Stand tall with a dumbbell in each hand, palms facing your thighs, like holding a hammer.","Curl the dumbbells up toward your shoulders. Your palms keep facing each other.","Squeeze at the top for 1 second.","Lower over 3 seconds. This grip builds thicker forearms."],"bad":["Swinging your body. Lower the weight.","Letting your wrists bend. Keep your wrists straight."],"A":{"m":"f","x":120},"B":{"m":"f","x":120,"fa":155},"mov":[{"t":"dbl","at":"wr"}],"w":{"f":0.11,"u":"hand","step":2,"note":"Per hand. About 80 percent of what you can curl with a normal grip."}};
EX.inclinecurl = {"n":"Incline dumbbell curl","m":"Biceps (long head)","s":"3×10–12","sets":3,"rest":"60 s","eq":"Incline bench at about 50°, dumbbells","cap":["Arms hanging back","Curled"],"cues":["Sit back on an incline bench with a dumbbell in each hand and your arms hanging straight down, slightly behind your torso.","Without moving your upper arms, curl the dumbbells up toward your shoulders.","Squeeze at the top for 1 second.","Lower fully until your arms are straight again. The deep stretch at the bottom is what makes this one special."],"bad":["Elbows drifting forward. Keep them behind your torso line.","Shoulders rolling forward. Keep your back against the pad.","Bouncing at the bottom. Pause in the stretch."],"A":{"m":"h","x":140,"y":140,"t":-45,"th":88,"sh":0,"ua":-8,"fa":-8,"hd":-8},"B":{"m":"h","x":140,"y":140,"t":-45,"th":88,"sh":0,"ua":-8,"fa":150,"hd":150},"fur":[{"t":"line","x1":130,"y1":146,"x2":86,"y2":102,"w":8},{"t":"rect","x":126,"y":142,"w":54,"h":6}],"mov":[{"t":"db","at":"wr","r":7,"oy":6}],"w":{"ref":"bench","f":0.2,"u":"hand","step":2,"inc":2,"note":"Per hand. Lighter than a standing curl because of the long stretch."}};
EX.ohtri = {"n":"Overhead triceps extension","m":"Triceps (long head)","s":"3×12","sets":3,"rest":"60 s","eq":"One dumbbell, or a cable with rope","cap":["Arms overhead","Elbows bent"],"cues":["Stand tall and hold one dumbbell with both hands above your head, arms straight.","Brace your stomach and keep your ribs down. This protects your lower back.","Bend only at the elbows, lowering the dumbbell behind your head. Upper arms stay still and close to your ears.","Straighten your arms to lift it back up."],"bad":["Leaning back and arching your lower back. Squeeze your glutes and ribs down.","Elbows flaring wide. Keep them pointing forward."],"A":{"m":"f","x":120,"ua":180,"fa":180},"B":{"m":"f","x":120,"ua":180,"fa":335},"mov":[{"t":"db","at":"wr","r":8}],"w":{"f":0.15,"u":"total","step":2,"note":"One dumbbell held with both hands. Start light because the range is long."}};
EX.pushdown = {"n":"Triceps pushdown","m":"Triceps","s":"3×12","sets":3,"rest":"60 s","eq":"High cable, rope or bar","cap":["Elbows bent","Arms straight"],"cues":["Stand close to the cable, lean forward slightly, elbows tucked to your ribs.","Push the handle down until your arms are fully straight.","Squeeze your triceps for 1 second.","Let the handle rise to about chest height. Elbows never move."],"bad":["Elbows flaring out or drifting forward. Pin them to your sides.","Leaning over the weight. Stay tall with only a slight lean."],"A":{"m":"f","x":120,"t":8,"ua":2,"fa":100},"B":{"m":"f","x":120,"t":8,"ua":2,"fa":0},"fur":[{"t":"line","x1":150,"y1":10,"x2":214,"y2":10,"w":5},{"t":"rect","x":210,"y":10,"w":10,"h":177}],"mov":[{"t":"cable","at":"wr","to":[150,10]}],"w":{"f":0.22,"u":"total","step":2.5,"note":"Machine stack. Keep it light enough that your elbows stay still."}};
EX.skullcrusher = {"n":"EZ-bar skull crusher","m":"Triceps","s":"3×10","sets":3,"rest":"75 s","eq":"Flat bench, EZ bar","cap":["Arms straight","Bar by forehead"],"cues":["Lie on a flat bench holding the EZ bar above your chest with straight arms.","Keep your upper arms still and angled slightly back. Bend only at the elbows and lower the bar toward your forehead.","Stop just above your forehead. Keep your elbows pointing at the ceiling, not flaring out.","Straighten your arms to return. Squeeze your triceps at the top."],"bad":["Elbows flaring wide. Keep them narrow.","Bouncing the bar off your head. Stop above your forehead and keep control.","Arching off the bench. Keep your glutes down and ribs down."],"A":{"m":"f","x":150,"sh":-10,"th":84,"t":-90,"ua":180,"fa":180},"B":{"m":"f","x":150,"sh":-10,"th":84,"t":-90,"ua":190,"fa":295},"fur":[{"t":"rect","x":36,"y":143,"w":122,"h":7},{"t":"rect","x":56,"y":150,"w":5,"h":37},{"t":"rect","x":136,"y":150,"w":5,"h":37}],"mov":[{"t":"plate","at":"wr","r":7}],"w":{"ref":"bench","f":0.35,"u":"total","step":2.5,"inc":2.5,"note":"Total including the EZ bar, which weighs about 8 to 10 kg. Elbows are recovering, so start light and add slowly."}};
EX.dip = {"n":"Parallel bar dip","m":"Chest, triceps, front shoulders","s":"3×6–10","sets":3,"rest":"90 s","eq":"Dip bars, or an assisted dip machine","cap":["Arms straight","Upper arms level"],"cues":["Support yourself on the bars with straight arms. Pull your shoulders down and back, and lean forward slightly.","Lower yourself by bending your elbows until your upper arms are about level with the floor.","Stop earlier if your shoulders feel pinched. Depth should feel strong, not stretchy.","Press back up to straight arms without shrugging."],"bad":["Shrugging up toward your ears. Keep your shoulders down.","Dropping too deep. Stop at level upper arms.","Swinging your legs for momentum. Keep your body quiet."],"A":{"m":"h","pin":{"j":"hand","at":[126,112]},"t":14,"th":4,"sh":-105,"ua":0,"fa":0,"hd":0},"B":{"m":"h","pin":{"j":"hand","at":[126,112]},"t":35,"th":5,"sh":-105,"ua":-80,"fa":10,"hd":0},"fur":[{"t":"rect","x":106,"y":117,"w":40,"h":4},{"t":"rect","x":142,"y":121,"w":5,"h":66}],"w":{"ref":"bw","u":"bw","note":"Bodyweight. Use the assisted dip machine until you can do 3×6. Once 3×10 is easy, add weight on a belt."}};
EX.wristcurl = {"n":"Wrist curl","m":"Forearm flexors","s":"3×15","sets":3,"rest":"45 s","eq":"Dumbbell or EZ bar, bench","cap":["Wrists lowered","Wrists curled"],"cues":["Sit with your forearms resting on your thighs, palms up, wrists hanging past your knees.","Let the weight roll down to your fingertips, then close your hand and curl the weight up.","Lift as high as you can using only your wrists. Squeeze for 1 second.","Lower slowly. Your forearms stay glued to your thighs."],"bad":["Lifting your forearms off your thighs. Rest them firmly.","Going too heavy. These are small muscles, so use light weights and high reps."],"A":{"m":"h","x":120,"y":140,"t":40,"th":90,"ua":0,"fa":90,"hd":40},"B":{"m":"h","x":120,"y":140,"t":40,"th":90,"ua":0,"fa":90,"hd":140},"fur":[{"t":"rect","x":94,"y":148,"w":70,"h":6}],"mov":[{"t":"db","at":"hand","r":7}],"w":{"f":0.08,"u":"total","step":1,"note":"Per dumbbell or total on a bar. Start light, then add reps before weight."}};
EX.revwrist = {"n":"Reverse wrist curl","m":"Forearm extensors (top of forearm)","s":"3×15","sets":3,"rest":"45 s","eq":"Light dumbbell, bench","cap":["Wrists lowered","Wrists raised"],"cues":["Sit with your forearms resting on your thighs, palms facing down, wrists hanging past your knees.","Lower the weight by letting your wrists bend down. Pause for a second.","Raise the back of your hand as high as you can using only your wrists.","Move slowly. Your forearms stay glued to your thighs."],"bad":["Going too heavy. These muscles are small, so use light dumbbells and high reps.","Lifting your forearms off your thighs. Rest them firmly."],"A":{"m":"h","x":120,"y":140,"t":40,"th":90,"ua":0,"fa":90,"hd":140},"B":{"m":"h","x":120,"y":140,"t":40,"th":90,"ua":0,"fa":90,"hd":40},"fur":[{"t":"rect","x":94,"y":148,"w":70,"h":6}],"mov":[{"t":"db","at":"hand","r":7}],"w":{"ref":"bw","f":0.05,"u":"hand","step":1,"inc":1,"note":"One light dumbbell. Add reps before weight. The top of your forearm is what makes a wrist look broader."}};
EX.revcurl = {"n":"Reverse curl","m":"Forearms, brachialis","s":"3×12","sets":3,"rest":"45 s","eq":"EZ bar or barbell","cap":["Arms down","Curled"],"cues":["Hold the bar with an overhand grip, hands shoulder width. Elbows pinned to your sides.","Curl the bar up while keeping your wrists straight and strong.","Stop when your forearms are about vertical. Squeeze.","Lower slowly. This one builds the top of your forearm, the part that makes wrists look sturdier."],"bad":["Letting your wrists fold back. Choose a lighter bar.","Leaning back for momentum."],"A":{"m":"f","x":120},"B":{"m":"f","x":120,"fa":155},"mov":[{"t":"plate","at":"wr","r":10}],"w":{"f":0.14,"u":"total","step":2.5,"note":"Total including the EZ bar. You will be much weaker than in a normal curl, so do not worry about the number."}};
EX.farmers = {"n":"Farmer's carry","m":"Grip, forearms, traps, core","s":"3×30 m","sets":3,"rest":"75 s","eq":"Heavy dumbbells","cap":["Step","Step"],"cues":["Pick up a heavy dumbbell in each hand. Stand tall with shoulders back and down.","Walk with short, quick steps. Keep your ribs down and your stomach tight.","Do not lean to either side. Let the weight hang like a bucket and keep your posture.","Walk 30 m, turn around, then put them down with a flat back."],"bad":["Leaning back with a puffed-out chest. Ribs down.","Letting the dumbbells swing. Shorten your steps."],"A":{"m":"f","x":120,"l2":{"th":-22,"sh":-5}},"B":{"m":"f","x":120,"l2":{"th":25,"sh":10}},"mov":[{"t":"dbl","at":"wr"}],"w":{"f":0.25,"u":"hand","step":2,"note":"Per hand. Heavy but doable, so your grip is the limit."}};
EX.bbench = {"n":"Barbell bench press","m":"Chest, front shoulders, triceps","s":"4×6–8","sets":4,"rest":"2 min","eq":"Flat bench with rack and safety arms, barbell","cap":["Arms up","Bar at chest"],"cues":["Lie with your eyes under the bar. Plant your feet flat and pull your shoulder blades together and down.","Grip just outside shoulder width. Unrack the bar and hold it over your shoulders with straight arms.","Lower it to the middle of your chest over 2 seconds, with elbows about 45° from your body.","Press back up. Keep your glutes on the bench and your ribs down the whole time."],"bad":["Arching your lower back hard and lifting your glutes to push the weight. Keep a small natural arch only.","Bouncing the bar off your chest. Touch it lightly and press.","Pressing without a spotter or safety arms."],"A":{"m":"f","x":150,"sh":-10,"th":84,"t":-90,"ua":180,"fa":180},"B":{"m":"f","x":150,"sh":-10,"th":84,"t":-90,"ua":25,"fa":170},"fur":[{"t":"rect","x":36,"y":143,"w":122,"h":7},{"t":"rect","x":56,"y":150,"w":5,"h":37},{"t":"rect","x":136,"y":150,"w":5,"h":37}],"mov":[{"t":"plate","at":"wr","r":9}],"w":{"f":0.4,"u":"total","step":2.5,"note":"Total including the 20 kg bar. Weeks 1 and 2 are the bar or just above it."}};
EX.pulldown = {"n":"Lat pulldown","m":"Lats, biceps","s":"4×8–10","sets":4,"rest":"90 s","eq":"Lat pulldown machine","cap":["Arms overhead","Bar at chest"],"cues":["Grip the bar slightly wider than your shoulders. Lock your thighs under the pads.","Lean back a little and lift your chest toward the bar.","Pull the bar down to your upper chest by driving your elbows down and back.","Let the bar rise until your arms are straight and you feel a stretch in your lats."],"bad":["Pulling behind your neck. Bring the bar to the front.","Leaning back a long way and swinging. Keep a slight lean only."],"A":{"m":"h","x":130,"y":140,"t":-10,"th":90,"ua":170,"fa":170},"B":{"m":"h","x":130,"y":140,"t":-10,"th":90,"ua":-20,"fa":165},"fur":[{"t":"rect","x":100,"y":142,"w":62,"h":6},{"t":"rect","x":127,"y":2,"w":50,"h":6},{"t":"rect","x":172,"y":2,"w":8,"h":185}],"mov":[{"t":"cable","at":"wr","to":[131,5]},{"t":"box","at":"kn","dx":-26,"dy":-14,"w":22,"h":8}],"w":{"f":0.55,"u":"total","step":2.5,"note":"Machine stack. If assisted pull-ups are available, those work as well."}};
EX.incline = {"n":"Incline dumbbell press","m":"Upper chest, shoulders","s":"3×10","sets":3,"rest":"75 s","eq":"Incline bench (about 30°), dumbbells","cap":["Arms up","Dumbbells at chest"],"cues":["Set the bench to a low incline, about 30°. Sit back with the dumbbells on your thighs and kick them up.","Pull your shoulder blades back and keep them on the pad.","Lower the dumbbells to your upper chest with your elbows about 45° from your body.","Press up until your arms are straight. Keep your ribs down."],"bad":["Setting the bench too steep. Above 45° it becomes a shoulder press.","Lifting your hips off the seat. Keep your glutes down."],"A":{"m":"f","x":165,"sh":-8,"th":70,"t":-45,"ua":180,"fa":180},"B":{"m":"f","x":165,"sh":-8,"th":70,"t":-45,"ua":45,"fa":175},"fur":[{"t":"line","x1":125,"y1":131,"x2":89,"y2":95,"w":8},{"t":"rect","x":116,"y":132,"w":50,"h":6}],"mov":[{"t":"db","at":"wr","r":8}],"w":{"f":0.17,"u":"hand","step":2,"note":"Per hand. Usually about 80 percent of your flat bench weight."}};
EX.row = {"n":"Seated cable row","m":"Mid back, lats, biceps","s":"3×10","sets":3,"rest":"75 s","eq":"Cable row station","cap":["Arms long","Handle at belly"],"cues":["Sit tall with feet on the plates and knees slightly bent. Grab the handle with arms straight.","Lean back just a few degrees, then pull the handle to your belly button.","Drive your elbows back past your ribs and squeeze your shoulder blades together for 1 second.","Let your arms stretch forward under control. Your torso barely moves."],"bad":["Rocking your whole torso to heave the weight. Keep your body quiet.","Shrugging toward your ears. Keep your shoulders down."],"A":{"m":"h","x":100,"y":158,"t":15,"th":75,"sh":98,"ua":85,"fa":85,"fo":-80},"B":{"m":"h","x":100,"y":158,"t":-5,"th":75,"sh":98,"ua":-30,"fa":95,"fo":-80},"fur":[{"t":"rect","x":70,"y":166,"w":50,"h":6},{"t":"rect","x":188,"y":140,"w":6,"h":47},{"t":"rect","x":228,"y":96,"w":10,"h":91}],"mov":[{"t":"cable","at":"wr","to":[233,114]}],"w":{"f":0.5,"u":"total","step":2.5,"note":"Machine stack. Brands label stacks differently, so use effort as your guide."}};
EX.sho = {"n":"Dumbbell shoulder press","m":"Shoulders, triceps","s":"3×10","sets":3,"rest":"75 s","eq":"Bench with back support, dumbbells","cap":["At shoulders","Arms overhead"],"cues":["Sit with your back on the pad, dumbbells at shoulder height, forearms vertical.","Brace your stomach and pull your ribs down. Your lower back stays flat on the pad.","Press straight up until your arms are almost straight above your shoulders.","Lower back to ear level over 2 seconds."],"bad":["Arching your lower back as you press. This is the common one if you have lordosis, so keep your ribs down.","Pressing forward instead of straight up."],"A":{"m":"h","x":120,"y":140,"th":90,"ua":10,"fa":180},"B":{"m":"h","x":120,"y":140,"th":90,"ua":180,"fa":180},"fur":[{"t":"line","x1":108,"y1":56,"x2":108,"y2":142,"w":8},{"t":"rect","x":96,"y":142,"w":62,"h":6}],"mov":[{"t":"db","at":"wr","r":8}],"w":{"f":0.13,"u":"hand","step":2,"note":"Per hand. Shoulders are small muscles, so this is lighter than the bench."}};
EX.facepull = {"n":"Face pull","m":"Rear shoulders, upper back","s":"3×15","sets":3,"rest":"60 s","eq":"Cable with rope, set at face height","cap":["Arms forward","Hands at face"],"cues":["Set the cable at face height and grab the rope with thumbs toward you. Step back to take the weight.","Pull the rope toward your face, splitting the ends apart as you go.","Finish with your elbows high and wide, hands near your ears. Squeeze your upper back.","Return slowly. This one is for posture, so keep the weight light."],"bad":["Using your lower back to lean away. Stay tall.","Letting your elbows drop low. Keep them level with your shoulders."],"A":{"m":"f","x":120,"ua":90,"fa":90},"B":{"m":"f","x":120,"ua":-70,"fa":130},"fur":[{"t":"rect","x":226,"y":20,"w":10,"h":167}],"mov":[{"t":"cable","at":"wr","to":[230,47]}],"w":{"f":0.15,"u":"total","step":2.5,"note":"Machine stack. Light on purpose, because the goal is clean reps, not heavy ones."}};

      '<div><b>' + Math.round(S.bw * 1.6) + '–' + Math.round(S.bw * 2.2) + ' g</b><span>Protein a day, spread over 3 or 4 meals.</span></div>' +
      '<div><b>0.2–0.4 kg</b><span>Weight gain a week is the target. Faster than that is mostly fat.</span></div>' +
      '<div><b>8 hours</b><span>Of sleep. Skipping it cuts growth more than skipping a set does.</span></div></div></section>';
  }

  function ckSync(setDefaults) {
    var id = $('#ck-ex').value, r = repRange(id);
    if (setDefaults) { $('#ck-kg').value = num(loadFor(id)); $('#ck-reps').value = r[0]; }
    var kg = parseFloat($('#ck-kg').value), reps = parseInt($('#ck-reps').value, 10), feel = $('#ck-feel').value, out = $('#ck-out');
    if (!(kg > 0) || isNaN(reps)) { out.textContent = 'Enter the weight and reps to get advice.'; return; }
    var w = EX[id].w, step = w.inc || w.step * 2, min = w.step;
    var up = rnd(kg * 1.075, min), down = rnd(kg * 0.9, min), msg;
    if (reps < r[0]) msg = 'Too heavy for ' + r[0] + (r[1] > r[0] ? ' to ' + r[1] : '') + ' reps. Next time use ' + num(down) + ' ' + unitOf(id) + '.';
    else if (feel === 'easy') msg = 'Too light. Next time try ' + num(Math.max(up, kg + min)) + ' ' + unitOf(id) + '.';
    else if (feel === 'hard') msg = 'Right at your limit. Stay at ' + num(kg) + ' ' + unitOf(id) + ' and aim for cleaner reps. If your form broke down, drop to ' + num(rnd(kg * 0.95, min)) + '.';
    else if (reps >= r[1]) msg = 'Good. If every set reached ' + r[1] + ' reps, add ' + num(step) + ' ' + unitOf(id) + ' next session, so ' + num(kg + step) + '.';
    else msg = 'Right weight. Keep ' + num(kg) + ' ' + unitOf(id) + ' and add a rep each session until you reach ' + r[1] + '.';
    out.textContent = msg;
  }
  function refreshLoads() {
    var t = $('#wt'); if (t) t.innerHTML = tableRows();
    var b = $('#blk'); if (b) b.textContent = blockChip();
    var w = $('#wave'); if (w) w.innerHTML = waveTiles();
    if ($('#ck-ex')) ckSync(false);
  }

  /* ---- animation ---- */
  var anim = { raf: 0, mode: 'play', ex: null, t0: 0, last: '' };
  function drawAt(u) {
    var svg = $('#fig'); if (!svg || !anim.ex) return;
    svg.innerHTML = figureSVG(anim.ex, u);
    var lab = u < 0.5 ? anim.ex.cap[0] : anim.ex.cap[1], ph = $('#phase');
    if (ph && lab !== anim.last) { ph.textContent = lab; anim.last = lab; }
  }
  function frame(now) {
    var svg = $('#fig'); if (!svg || anim.mode !== 'play') { anim.raf = 0; return; }
    var c = ((now - anim.t0) / 1000) % 3.6, u;
    if (c < 0.5) u = 0; else if (c < 1.8) u = (c - 0.5) / 1.3; else if (c < 2.3) u = 1; else u = 1 - (c - 2.3) / 1.3;
    drawAt(ease(u));
    anim.raf = requestAnimationFrame(frame);
  }
  function setMode(m) {
    anim.mode = m;
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === m)); });
    cancelAnimationFrame(anim.raf); anim.raf = 0;
    if (m === 'play') { anim.t0 = performance.now(); anim.raf = requestAnimationFrame(frame); }
    else drawAt(m === 'A' ? 0 : 1);
  }
  function mountFigure() {
    cancelAnimationFrame(anim.raf); anim.raf = 0;
    if (S.tab !== 'week' || !S.openKey || !$('#fig')) return;
    anim.ex = EX[S.openKey.split(':')[1]]; anim.last = '';
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    anim.mode = reduce ? 'A' : 'play';
    drawAt(0); setMode(anim.mode);
  }

  /* ---- render and events ---- */
  function defaultOpen() {
    var d = DAYS[S.day], id = d.ex[0] || dailyFor(d)[0];
    S.openKey = id ? d.k + ':' + id : null;
  }
  function centerDay() {
    var strip = $('.week'), b = strip && $('[data-day="' + S.day + '"]', strip);
    if (!strip || !b || strip.scrollWidth <= strip.clientWidth) return;
    strip.scrollLeft = Math.max(0, b.offsetLeft - (strip.clientWidth - b.offsetWidth) / 2);
  }
  function stats() {
    var w = blockWeek();
    $('#st-done').textContent = sessionsIn(wk) + '/' + sessionDays().length;
    $('#st-streak').textContent = streak();
    $('#st-wk').textContent = (w > 8 ? 'Done' : w + '/8');
  }
  function render() {
    ['week', 'wt', 'prog'].forEach(function (t) { $('#t-' + t).setAttribute('aria-selected', String(S.tab === t)); });
    view.innerHTML = S.tab === 'week' ? weekView() : S.tab === 'wt' ? weightsView() : progressView();
    if (S.tab === 'wt') ckSync(true);
    stats(); showWarn(); mountFigure(); if (S.tab === 'week') centerDay();
  }
  function typing() { var a = document.activeElement; return !!(a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    if (t.id === 't-week' || t.id === 't-wt' || t.id === 't-prog') { S.tab = t.id.slice(2); render(); return; }
    var d = t.getAttribute('data-day');
    if (d != null) { S.day = +d; defaultOpen(); render(); return; }
    var o = t.getAttribute('data-open');
    if (o) { S.openKey = S.openKey === o ? null : o; render(); var r = $('[data-k="' + o + '"]'); if (r && S.openKey && r.scrollIntoView) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
    var m = t.getAttribute('data-mode'); if (m) { setMode(m); return; }
    var s = t.getAttribute('data-set');
    if (s) {
      var p = s.split('|'), key = p[0], i = +p[1], id = key.split(':')[1], n = setsFor(id), cur = getSets(key, n)[i], inp = $('#wkg'), kg = inp ? parseFloat(inp.value) : NaN, rinp = $('#wr'), rp = rinp ? parseInt(rinp.value, 10) : NaN;
      setEntry(key, i, cur ? null : { t: Date.now(), kg: kg > 0 ? kg : null, r: rp >= 0 ? rp : null });
      if (!cur && kg > 0) S.kg[id] = { w: wk, v: kg };
      if (!cur && rp >= 0) S.rp[id] = { w: wk, v: rp };
      save();
      t.setAttribute('aria-pressed', String(!cur));
      var row = $('[data-k="' + key + '"]'), c = doneCount(key, n);
      row.classList.toggle('done', c === n); $('.prog', row).textContent = c + '/' + n;
      var sl = $('#setlog', row); if (sl) sl.innerHTML = setLogHTML(key, id);
      stats(); refreshStrip();
      return;
    }
    if (t.getAttribute('data-copy')) {
      var ta = $('#bk-out'), msg = $('#bk-msg');
      function fallback() { ta.focus(); ta.select(); msg.textContent = 'Text selected. Copy it with your keyboard or the share menu.'; }
      try { navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = 'Backup copied.'; }, fallback); } catch (e) { fallback(); }
      return;
    }
    if (t.getAttribute('data-restore')) {
      var m2 = $('#bk-msg'), raw = $('#bk-in').value.trim();
      try {
        var st = JSON.parse(raw);
        if (!st || typeof st.log !== 'object' || st.log === null || Array.isArray(st.log)) throw new Error('bad');
        applyStore(st); save(); render();
        $('#bk-msg').textContent = 'Backup restored.';
      } catch (e) { m2.textContent = 'That text is not a valid backup. Copy the whole backup and try again.'; }
    }
  });
  function refreshStrip() {
    var strip = $('.week'); if (!strip || S.tab !== 'week') return;
    var keep = strip.scrollLeft, tmp = document.createElement('div'); tmp.innerHTML = weekView();
    var ns = tmp.querySelector('.week'); if (ns) { strip.innerHTML = ns.innerHTML; strip.scrollLeft = keep; }
  }
  document.addEventListener('input', function (ev) {
    var id = ev.target.id, v;
    if (id === 'bw') { v = parseFloat(ev.target.value); if (v >= 35 && v <= 200) { S.bw = v; save(); refreshLoads(); } }
    else if (/^rm-/.test(id)) { v = parseFloat(ev.target.value); S.rm[id.slice(3)] = v > 0 ? v : ''; save(); refreshLoads(); }
    else if (id === 'st') { if (/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)) { S.start = ev.target.value; save(); refreshLoads(); stats(); } }
    else if (id === 'wkg') { if (S.openKey) { var ex = S.openKey.split(':')[1], kv = parseFloat(ev.target.value); S.kg[ex] = { w: wk, v: kv > 0 ? kv : '' }; save(); } }
    else if (id === 'wr') { if (S.openKey) { var ex2 = S.openKey.split(':')[1], rv = parseInt(ev.target.value, 10); S.rp[ex2] = { w: wk, v: rv >= 0 ? rv : '' }; save(); } }
    else if (/^bm-/.test(id)) {
      var p = id.split('-'), x = S.bm[p[1]] = S.bm[p[1]] || {}, nv = parseFloat(ev.target.value);
      x[p[2]] = nv > 0 ? nv : ''; save(); var c = $('#bmd-' + p[1]); if (c) c.textContent = bmDelta(p[1]);
    }
    else if (id === 'ck-ex') ckSync(true);
    else if (id === 'ck-kg' || id === 'ck-reps' || id === 'ck-feel') ckSync(false);
  });

  /* ---- keep everything current ---- */
  function tick() {
    var nk = weekKey(), nd = (new Date().getDay() + 6) % 7;
    if (nk !== wk) { wk = nk; S.day = nd; lastDow = nd; defaultOpen(); render(); return; }
    if (nd !== lastDow) { lastDow = nd; if (!typing()) render(); return; }
    stats();
    if (S.tab === 'prog' && !typing()) render();
  }
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    applyStore(readStore()); tick(); if (!typing()) render();
  });
  window.addEventListener('storage', function (e) {
    if (e.key !== LS) return;
    applyStore(readStore()); if (!typing()) render();
  });

  defaultOpen(); render();
})();
</script>
<script type="text/plain" id="app-home-css">
/* Layout: header stats, three tabs, a seven-day strip, one open exercise at a time with the form figure beside its cues.
   Cool concrete with one colour per session type: brick for push, blue for pull, pine for legs, plum for core, amber for power. */
:root{
  --bg:#E5E8EA; --surface:#F5F7F8; --surface-2:#EBEEF0; --ink:#15181B; --ink-2:#545B61; --line:#CDD3D7;
  --accent:#B4351F; --accent-ink:#FFFFFF; --accent-soft:#F6DDD7;
  --push:#B4351F; --pull:#2B5FA8; --legs:#1F6F55; --core:#7A4FA3; --power:#9A6A00; --rest:#6B7280;
  --good:#15803D; --warn:#B45309; --bad:#B91C1C;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --surface:#181B1E; --surface-2:#202427; --ink:#E8ECEE; --ink-2:#9AA3AA; --line:#2E3438;
  --accent:#F0795F; --accent-ink:#101214; --accent-soft:#3A201A;
  --push:#F0795F; --pull:#6FA3E8; --legs:#4FC49C; --core:#B592DC; --power:#E2B03A; --rest:#9CA3AF;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#181B1E; --surface-2:#202427; --ink:#E8ECEE; --ink-2:#9AA3AA; --line:#2E3438;
  --accent:#F0795F; --accent-ink:#101214; --accent-soft:#3A201A;
  --push:#F0795F; --pull:#6FA3E8; --legs:#4FC49C; --core:#B592DC; --power:#E2B03A; --rest:#9CA3AF;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,9vw,66px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.top h1 span{color:var(--push)}
.top p{margin:8px 0 0;color:var(--ink-2);max-width:46ch}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.stat span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:560px){.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}.stat span{font-size:11px;letter-spacing:.03em}}
.warn{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:5px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:760px){.week{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.week button{flex:0 0 132px;scroll-snap-align:start}.day strong{font-size:19px}}
.day{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;border-radius:6px 6px 0 0;background:var(--c,var(--rest))}
.day small{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.day strong{font-family:var(--f-display);font-size:21px;line-height:1.05;font-weight:700;text-transform:uppercase;overflow-wrap:break-word;hyphens:none}
.day em{font-style:normal;font-size:12px;color:var(--ink-2)}
.day[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.day .today{position:absolute;top:12px;right:9px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--c);padding:1px 6px;border-radius:99px}
.day.done em{color:var(--good);font-weight:600}
.track{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c)}

/* session */
.session{--accent:var(--c);--accent-soft:color-mix(in srgb,var(--c) 14%,var(--surface));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.s-head{padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.s-head h2{margin:0;font-family:var(--f-display);font-size:clamp(30px,6vw,44px);line-height:1;font-weight:800;text-transform:uppercase}
.s-head h2 span{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.s-note{margin:0;color:var(--ink-2);max-width:70ch}
.s-note b{color:var(--ink)}
.group-label{padding:12px 18px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-block:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* exercise rows */
.ex{border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex-h{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:14px 18px}
.ex-h:hover{background:var(--surface-2)}
.ex-n{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.ex-t{display:flex;flex-direction:column;min-width:0}
.ex-t strong{font-weight:600;font-size:16px}
.ex-t span{font-size:13px;color:var(--ink-2)}
.ex-r{display:flex;align-items:center;gap:10px}
.scheme{font-family:var(--f-mono);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);min-width:30px;text-align:right}
.ex.done .prog{color:var(--good)}
.ex-b{padding:2px 18px 20px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px}
@media (max-width:760px){.ex-b{grid-template-columns:minmax(0,1fr)}.ex-h{padding-inline:14px;gap:8px}.scheme{font-size:12.5px}}
.fig{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-width:100%}
.phase{position:absolute;left:10px;top:10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px;max-width:calc(100% - 20px)}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.info h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.avoid{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.avoid li{padding-left:22px;position:relative}
.avoid li::before,.avoid li::after{content:"";position:absolute;left:3px;top:.7em;width:10px;height:2px;background:var(--bad)}
.avoid li::before{transform:rotate(45deg)}
.avoid li::after{transform:rotate(-45deg)}
.load{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.load .big{font-family:var(--f-mono);font-size:24px;font-weight:500;color:var(--accent)}
.load small{color:var(--ink-2);flex:1 1 180px;min-width:0}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.sets button{width:40px;height:40px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono)}
.sets button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.wkg{display:flex;flex-direction:column;gap:10px}
.setlog{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.setlog b{color:var(--ink);font-weight:500}
.eq{font-size:13px;color:var(--ink-2);margin:0}
.eq b{color:var(--ink);font-weight:600}

/* figure drawing */
.floor{stroke:var(--line);stroke-width:2}
.st{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.st2{stroke:var(--ink-2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.55}
.hd{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.eqs{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft)}
.eql{stroke:var(--accent);stroke-width:3;stroke-linecap:round;fill:none}
.cab{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.fur{fill:var(--line);stroke:none}
.furl{stroke:var(--line);stroke-linecap:round;fill:none}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-family:var(--f-display);font-size:32px;font-weight:800;text-transform:uppercase;line-height:1}
.panel p{margin:0;color:var(--ink-2);max-width:70ch}
.form{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:120px;max-width:100%}
.field textarea{width:100%;font-family:var(--f-mono);font-size:12px;resize:vertical}
.ramp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.ramp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ramp div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px}
.ramp b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.ramp span{font-size:12.5px;color:var(--ink-2)}
.ramp div.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);white-space:nowrap}
tr.grp td{background:var(--surface-2);font-weight:700;font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
td small{display:block;color:var(--ink-2)}
.check{background:var(--surface-2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:600;color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rules div{background:var(--surface-2);border-radius:8px;padding:12px}
.rules b{display:block;margin-bottom:2px}
.rules span{font-size:13.5px;color:var(--ink-2)}

/* tracking */
.live{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.live i{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lab2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow small{display:block;color:var(--ink-2)}
.prow b{text-transform:none}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.pnum{display:flex;align-items:center;gap:8px;font-size:13px;justify-content:flex-end}
.pill{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2px 8px;border:1px solid var(--line);color:var(--ink-2)}
.pill.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto}.prow .pbar{grid-column:1 / -1;order:3}}
.chart{position:relative;display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:24px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.col .v{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.col .b{width:100%;max-width:44px;background:var(--line);border-radius:3px 3px 0 0}
.col.hit .b{background:var(--good)}
.col.cur .b{box-shadow:0 0 0 2px var(--accent)}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-2);pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--ink-2);background:var(--surface);padding-left:4px}
.labels{display:flex;gap:8px}
.labels span{flex:1;text-align:center;font-size:11px;color:var(--ink-2);min-width:0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 16px;font-weight:600}
.btn:hover{opacity:.9}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.bm input{width:92px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}.live i{animation:none}}

/* size block additions */
.reps{display:flex;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.hint b{color:var(--ink);font-weight:600}
.vrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.vrow b{font-weight:600}
.vbar{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vbar .tgt{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 22%,transparent);border-inline:1.5px dashed var(--good)}
.vbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--accent));opacity:.9}
.vrow .mono{font-size:13px;white-space:nowrap;text-align:right}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) auto}.vrow .vbar{grid-column:1 / -1;order:3}}
.ramp.three{grid-template-columns:repeat(4,minmax(0,1fr))}
.deload{border-style:dashed}
.lvl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.lvl{grid-template-columns:minmax(0,1fr)}}
.lvl div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px}
.lvl b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lvl span{font-size:13.5px}
.load .big{font-size:20px}

EX.stepup = {"n":"Dumbbell step-up","m":"Quads, glutes, single-leg strength","eq":"A sturdy chair, two 20 kg dumbbells","cap":["Foot on box","Standing on box"],"cues":["Stand facing a box about knee height with a dumbbell in each hand. Put your whole foot on the box.","Press through the heel of the front foot and stand tall. Do not push off the back foot.","Bring the back knee up to hip height at the top, then control it back down.","Lower slowly over 3 seconds. Finish all reps on one leg before you switch."],"bad":["Pushing off the floor foot. Keep the back foot light and use the front leg.","Leaning forward over the box. Stay tall with ribs down.","Box too high. Your hip should not drop below your knee at the start."],"A":{"m":"f","x":160,"y":147,"sh":-30,"th":80,"t":14,"l2":{"ik":[124,185],"dir":1,"fo":0}},"M":{"m":"f","x":160,"y":147,"sh":-15,"th":40,"t":8,"l2":{"ik":[140,142],"dir":1,"fo":0}},"B":{"m":"f","x":160,"y":147,"sh":0,"th":0,"t":0,"l2":{"ik":[188,128],"dir":1,"fo":0}},"fur":[{"t":"rect","x":140,"y":147,"w":62,"h":40}],"mov":[{"t":"dbl","at":"wr"}]};
EX.dbrow = {"n":"One-arm dumbbell row","m":"Lats, mid back, biceps, grip","eq":"A chair or sofa edge, one 20 kg dumbbell","cap":["Arm hanging","Elbow back"],"cues":["Put one hand and the same-side knee on a sofa or chair seat, or one hand on a chair and your other foot back. Keep your back flat.","Let the dumbbell hang from a straight arm with your shoulder blade relaxed forward.","Pull the dumbbell to your hip by driving your elbow up and back. Squeeze for 1 second.","Lower it all the way down. Finish all reps on one arm, then switch."],"bad":["Twisting your torso to lift the weight. Keep your shoulders level.","Shrugging toward your ear. Think elbow to hip.","Rounding your back. Keep your head in line with your spine."],"A":{"m":"f","x":120,"sh":-8,"th":22,"t":68,"ua":0,"fa":0,"hd":0},"B":{"m":"f","x":120,"sh":-8,"th":22,"t":68,"ua":-80,"fa":0,"hd":0},"fur":[{"t":"rect","x":162,"y":128,"w":62,"h":6},{"t":"rect","x":170,"y":134,"w":5,"h":53},{"t":"rect","x":212,"y":134,"w":5,"h":53}],"mov":[{"t":"db","at":"wr","r":8,"oy":9}]};
EX.slcalf = {"n":"Single-leg calf raise","m":"Calves","eq":"A stair or thick book, one 20 kg dumbbell, a wall to hold","cap":["Heel down","Heel up"],"cues":["Stand on one foot with the ball of your foot on a stair edge or thick book. Hold a wall with one hand and a 20 kg dumbbell in the other.","Let your heel sink as low as it goes and pause for a second in the stretch.","Rise as high as you can, balancing over your big toe, and pause for a second at the top.","Lower over 3 seconds. Finish all reps on one leg, then switch."],"bad":["Rolling onto the outside of your foot. Press through the big toe.","Bouncing out of the bottom. Pause in the stretch.","Half reps. Every rep goes from full stretch to full height."],"A":{"m":"f","x":120,"ua":0,"fa":0,"l2":{"th":6,"sh":-75,"fo":0}},"B":{"m":"f","x":127,"y":171,"fo":59,"ua":0,"fa":0,"l2":{"th":6,"sh":-75,"fo":0}},"fur":[{"t":"rect","x":100,"y":183,"w":44,"h":4}],"mov":[{"t":"db","at":"wr","r":7,"oy":8}]};
EX.bentcalf = {"n":"Bent-knee calf raise","m":"Calves (soleus)","eq":"A stair or thick book, one 20 kg dumbbell","cap":["Heel down","Heel up"],"cues":["Stand on the ball of one foot on the edge of a step. Hold a dumbbell in the same-side hand and use the other hand for balance.","Bend your knee slightly, about 20 to 30°, and keep that angle for every rep.","Let your heel sink for a deep stretch and pause for a second.","Rise as high as you can, pause for a second at the top, then lower over 3 seconds. Do all reps on one leg, then switch."],"bad":["Straightening your knee. This version is for the deeper calf muscle, so keep it bent.","Bouncing out of the stretch. Pause in the bottom.","Half reps. Every rep goes from full stretch to full height."],"A":{"m":"f","x":120,"th":14,"sh":-14,"ua":5},"B":{"m":"f","x":127,"y":171,"fo":59,"th":14,"sh":-14,"ua":5},"fur":[{"t":"rect","x":100,"y":183,"w":44,"h":4}],"mov":[{"t":"db","at":"wr","r":8}]};
EX.wristcurl = {"n":"Wrist curl","m":"Forearm flexors","eq":"A chair, one 20 kg dumbbell","cap":["Wrists lowered","Wrists curled"],"cues":["Sit with your forearm resting on your thigh, palm up, holding a 20 kg dumbbell with your wrist hanging past your knee.","Let the dumbbell roll down to your fingertips, then curl it back up.","Move only your wrist. Keep the forearm still.","20 kg may be heavy for wrists. Use the dumbbell only if you can do 15 slow reps, or switch to a water bottle."],"bad":["Lifting your forearms off your thighs. Rest them firmly.","Going too heavy. These are small muscles, so use light weights and high reps."],"A":{"m":"h","x":120,"y":140,"t":40,"th":90,"ua":0,"fa":90,"hd":40},"B":{"m":"h","x":120,"y":140,"t":40,"th":90,"ua":0,"fa":90,"hd":140},"fur":[{"t":"rect","x":94,"y":148,"w":70,"h":6}],"mov":[{"t":"db","at":"hand","r":7}]};
EX.hammer = {"n":"Hammer curl","m":"Biceps, brachialis, forearms","eq":"Two 20 kg dumbbells","cap":["Arms down","Curled"],"cues":["Stand tall with a dumbbell in each hand, palms facing your thighs, like holding a hammer.","Curl the dumbbells up toward your shoulders. Your palms keep facing each other.","Squeeze at the top for 1 second.","Lower over 3 seconds. This grip builds thicker forearms."],"bad":["Swinging your body. Lower the weight.","Letting your wrists bend. Keep your wrists straight."],"A":{"m":"f","x":120},"B":{"m":"f","x":120,"fa":155},"mov":[{"t":"dbl","at":"wr"}]};
EX.ohtri = {"n":"Overhead triceps extension","m":"Triceps (long head)","eq":"One 20 kg dumbbell","cap":["Arms overhead","Elbows bent"],"cues":["Stand tall and hold one dumbbell with both hands above your head, arms straight.","Brace your stomach and keep your ribs down. This protects your lower back.","Bend only at the elbows, lowering the dumbbell behind your head. Upper arms stay still and close to your ears.","Straighten your arms to lift it back up."],"bad":["Leaning back and arching your lower back. Squeeze your glutes and ribs down.","Elbows flaring wide. Keep them pointing forward."],"A":{"m":"f","x":120,"ua":180,"fa":180},"B":{"m":"f","x":120,"ua":180,"fa":335},"mov":[{"t":"db","at":"wr","r":8}]};

EX.deadbug = {"n":"Dead bug","m":"Deep abs, pelvis control","eq":"Mat or carpet","cap":["Table top","Opposite arm and leg out"],"cues":["Lie on your back, arms straight up, hips and knees bent to 90°. Press your lower back gently into the floor.","Breathe out and slowly lower one arm overhead and the opposite leg toward the floor.","Go only as far as your lower back stays flat against the floor. Hover, do not touch.","Bring them back, switch sides. Move slowly, about 3 seconds each way."],"bad":["Lower back arching off the floor. This is the whole point, so shorten the range.","Holding your breath. Breathe out as the limbs extend."],"A":{"m":"h","x":150,"y":177,"t":-90,"th":180,"sh":90,"ua":180,"fa":180,"l2":{"th":180,"sh":90}},"B":{"m":"h","x":150,"y":177,"t":-90,"th":180,"sh":90,"ua":-100,"fa":-105,"l2":{"th":95,"sh":95}}};
EX.birddog = {"n":"Bird dog","m":"Lower back stability, glutes","eq":"Mat or carpet","cap":["On all fours","Opposite arm and leg out"],"cues":["Start on hands and knees, hands under shoulders, knees under hips. Spine long and flat.","Slowly reach one arm forward and the opposite leg back, until both are level with your back.","Hold 2 seconds. Imagine a glass of water balanced on your lower back.","Return with control and switch sides."],"bad":["Hips twisting open. Keep your belt line square to the floor.","Lifting the leg higher than your back. That arches your lower back, the thing you are fixing."],"A":{"m":"h","x":140,"y":132,"t":-90,"sh":-90,"l2":{"th":0,"sh":-90}},"B":{"m":"h","x":140,"y":132,"t":-90,"sh":-90,"ua":-90,"fa":-90,"l2":{"th":90,"sh":90}}};

EX.sldl = {"n":"Single-leg Romanian deadlift","m":"Hamstrings, glutes, balance","eq":"One dumbbell or kettlebell","cap":["Standing","Hinged"],"cues":["Stand on one leg with a soft knee. Hold the weight in the hand opposite your standing leg.","Hinge forward at the hip while the back leg lifts behind you, like a seesaw. Your torso and back leg move together.","Keep your hips square to the floor. Stop when your torso is about level or your hamstring stretches hard.","Squeeze your glute and stand tall. Finish all reps on one leg, then switch."],"bad":["Opening your hips up toward the side. Keep your belt line facing the floor.","Rounding your back. Shorten the range.","Locking your standing knee. Keep a soft bend."],"A":{"m":"f","x":120,"sh":-3,"th":3,"t":0,"ua":0,"fa":0,"l2":{"th":-5,"sh":-15,"fo":0}},"B":{"m":"f","x":120,"sh":-3,"th":3,"t":80,"ua":0,"fa":0,"l2":{"th":-80,"sh":-80,"fo":0}},"mov":[{"t":"db","at":"wr","r":8,"oy":8}]};

EX.pikepu = {"n":"Pike push-up","m":"Shoulders, triceps","eq":"Floor","cap":["Hips high, arms straight","Head between the hands"],"cues":["Start in a downward-dog shape: hips high, legs nearly straight, hands a little wider than your shoulders.","Look at a spot between your hands. Keep your hips high the whole set.","Bend your elbows and lower the top of your head toward the floor between your hands.","Press back up until your arms are straight and your hips are still high."],"bad":["Letting your hips sink so it becomes a normal push-up. Keep them high.","Elbows flaring wide. Keep them about 45° from your body.","Bouncing off the floor. Touch gently and press."],"A":{"m":"h","x":115,"y":100,"th":-17.4,"sh":-17.4,"t":113.6,"ua":-2,"fa":0.3},"B":{"m":"h","x":115,"y":100,"th":-17.4,"sh":-17.4,"t":164,"ua":-7.6,"fa":76.8}};
EX.floorpress = {"n":"Dumbbell floor press","m":"Chest, triceps, front shoulders","eq":"Two 20 kg dumbbells, floor","cap":["Arms straight up","Elbows on the floor"],"cues":["Lie on your back with knees bent and feet flat. Hold a 20 kg dumbbell in each hand over your chest.","Tuck your shoulder blades back and down against the floor.","Lower for 2 seconds until your upper arms touch the floor, with elbows about 45° from your body.","Pause for a second without relaxing, then press the dumbbells back up over your chest."],"bad":["Bouncing your elbows off the floor. Pause and press.","Flaring your elbows straight out to the sides. Keep them tucked.","Arching your lower back. Keep your ribs down and feet flat."],"A":{"m":"f","x":165,"sh":-10,"th":146,"t":-90,"ua":180,"fa":180},"B":{"m":"f","x":165,"sh":-10,"th":146,"t":-90,"ua":100,"fa":180},"mov":[{"t":"db","at":"wr","r":8}]};

EX.slidecurl = {"n":"Towel hamstring curl","m":"Hamstrings, glutes","eq":"A towel and a smooth floor","cap":["Hips up, legs long","Heels pulled in"],"cues":["Lie on your back with your heels on a towel on a smooth floor. Lift your hips into a bridge.","Keep your hips high and your glutes squeezed the whole set.","Slowly slide your heels away until your legs are almost straight, taking 3 seconds.","Curl your heels back toward your bottom without letting your hips drop."],"bad":["Hips dropping. Squeeze your glutes and keep them high.","Sliding too far to control. Go only as far as you can pull back.","Arching your lower back. Keep your ribs down."],"A":{"m":"h","x":100,"y":130,"t":-146,"n":56,"th":52.5,"sh":52.5,"ua":90,"fa":90},"B":{"m":"h","x":100,"y":130,"t":-146,"n":56,"th":70,"sh":-40,"ua":90,"fa":90}};
EX.jumpsquat = {"n":"Jump squat","m":"Quads, glutes, calves, power","eq":"Floor","cap":["Deep squat","In the air"],"cues":["Stand with feet shoulder width apart. Squat down to about parallel and swing your arms back.","Drive up hard through your whole foot and jump as high as you can.","Land softly on the balls of your feet, then sink straight into the next squat.","Rest for a second between reps if the landings get sloppy."],"bad":["Landing with straight, stiff legs. Bend your knees on every landing.","Knees caving inward on landing. Push them out over your toes.","Doing it tired. Stop the set when your jump height drops."],"A":{"m":"f","x":120,"t":38,"th":82,"sh":-28,"ua":-35,"fa":-35},"B":{"m":"f","x":120,"y":150,"t":0,"th":0,"sh":0,"ua":30,"fa":30,"fo":25}};

  function weekView() {
    var today = (new Date().getDay() + 6) % 7, day = DAYS[S.day], c = 'var(--' + day.cat + ')';
    var strip = DAYS.map(function (d, i) {
      var st = dayStats(d), tracked = SESSION_CATS[d.cat] && d.ex.length;

    var sess = '<section class="session" style="--c:' + c + '"><div class="s-head"><h2><span>' + day.name + '</span> · ' + day.title + '</h2>' +
      '<div class="chips"><span class="chip"><b>Focus</b> ' + esc(day.focus) + '</span><span class="chip"><b>Time</b> ' + day.dur + '</span></div>' +
      '<p class="s-note">' + esc(day.note) + '</p>' + (day.warm ? '<p class="s-note"><b>Warm-up</b> ' + esc(day.warm) + '</p>' : '') + '</div>' +
      (rows ? '<div class="group-label"><span>Main session</span><span>Tap an exercise to open the form guide</span></div>' + rows : '') + '</section>';

  /* ---- progress view ---- */
  function bmCell(id, which) { var v = (S.bm[id] || {})[which]; return '<input type="number" inputmode="decimal" step="0.1" min="0" id="bm-' + id + '-' + which + '" value="' + (v != null ? v : '') + '" aria-label="' + which + '">'; }

  function progressView() {

      '<div><b>' + tt.sets + '</b><span>Sets logged in total.</span></div>' +
      '<div><b>' + tt.sessions + '</b><span>Sessions done in total' + (tt.first ? ', since ' + dayLabel(tt.first) : '') + '.</span></div></div>' +
      '<div class="lab2">' + DOW[m.getDay()] + ' ' + m.getDate() + ' ' + MON[m.getMonth()] + ' to ' + DOW[end.getDay()] + ' ' + end.getDate() + ' ' + MON[end.getMonth()] + '</div>' +
      sd.map(function (d) {
        var s = dayStats(d), p = Math.min(100, Math.round(s.pct * 100)), ok = sessionDone(d), when = s.tmin ? dayLabel(s.tmin) + ', ' + hhmm(s.tmin) + (s.tmax && hhmm(s.tmax) !== hhmm(s.tmin) ? ' to ' + hhmm(s.tmax) : '') : 'Not started';
        return '<div class="prow" style="--c:var(--' + d.cat + ')"><div><b>' + d.name + '</b> · ' + d.title + '<small>' + when + '</small></div>' +
          '<div class="pbar" role="img" aria-label="' + p + ' percent"><i style="width:' + p + '%"></i></div>' +
          '<div class="pnum mono">' + s.done + '/' + s.total + '<span class="pill ' + (ok ? 'ok' : 'idle') + '">' + (ok ? 'Done' : s.done ? 'In progress' : 'To do') + '</span></div></div>';
      }).join('') + '</section>';
    var vol = volumeData(), volRows = MUSCLES.map(function (mu) {

      '<div class="chart" role="img" aria-label="Sessions completed per week"><div class="goal" style="bottom:' + Math.round(GOAL / max * H) + 'px"><span>goal ' + GOAL + '</span></div>' +
      wd.map(function (w) { return '<div class="col' + (w.cur ? ' cur' : '') + (w.n >= GOAL ? ' hit' : '') + '"><span class="v">' + w.n + '</span><div class="b" style="height:' + Math.max(3, Math.round(w.n / max * H)) + 'px"></div></div>'; }).join('') +
      '</div><div class="labels">' + wd.map(function (w) { return '<span>' + w.d.getDate() + ' ' + MON[w.d.getMonth()] + '</span>'; }).join('') + '</div></section>';

      var ch = l.last - l.first, chs = l.n < 2 ? '—' : (ch > 0 ? '+' : '') + ch;

    var bench = '<section class="panel"><h2>Tests and measurements</h2><p>Test yourself in week 1 and again in week 8, fresh and warmed up. For the measurements use a soft tape first thing in the morning, and flex your arm hard for the flexed number. Reps and holds show how strong you got. Arms, thighs and weight show how much you grew.</p>' +

  /* ---- levels view ---- */
  function waveTiles() {

      '<section class="panel"><h2>Make it harder or easier</h2><p>When every set reaches the top of the range, use the harder version next session and start again from the bottom of the range. If you cannot reach the bottom of the range with clean form, use the easier version.</p>' +

      '<div><b>+250 kcal</b><span>A day above what keeps your weight steady, if size is the goal.</span></div>' +
      '<div><b>112–154 g</b><span>Protein a day for 70 kg, across 3 or 4 meals.</span></div>' +
      '<div><b>0.2–0.4 kg</b><span>Weight gain a week is the target.</span></div>' +

  /* ---- render and events ---- */

  function stats() { var w = blockWeek(); $('#st-done').textContent = sessionsIn(wk) + '/' + sessionDays().length; $('#st-streak').textContent = streak(); $('#st-wk').textContent = (w > 8 ? 'Done' : w + '/8'); }
  function render() {

  }
  function typing() { var a = document.activeElement; return !!(a && view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
  function refreshStrip() {

  });
  document.addEventListener('input', function (ev) {
    var id = ev.target.id;

  defaultOpen(); render();
})();

<script type="text/plain" id="app-fuel-css">
/* Layout: week strip on top, one open exercise at a time, figure beside its cues. Cobalt on cool grey, one colour per session type. */
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --surface-2:#F2F5F9; --ink:#0F1A2B; --ink-2:#4A5568; --line:#D3D9E2;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DCE6FF;
  --lower:#1D4ED8; --upper:#B45309; --recov:#0F766E; --cond:#BE185D; --rest:#64748B;
  --good:#15803D; --warn:#B45309;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A101B; --surface:#131B2A; --surface-2:#1A2436; --ink:#E8EDF5; --ink-2:#9BA8BC; --line:#27334A;
  --accent:#7B9BFF; --accent-ink:#0A101B; --accent-soft:#1E2E57;
  --lower:#7B9BFF; --upper:#F0A24B; --recov:#3CC4B3; --cond:#F472B6; --rest:#94A3B8;
  --good:#4ADE80; --warn:#F0A24B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A101B; --surface:#131B2A; --surface-2:#1A2436; --ink:#E8EDF5; --ink-2:#9BA8BC; --line:#27334A;
  --accent:#7B9BFF; --accent-ink:#0A101B; --accent-soft:#1E2E57;
  --lower:#7B9BFF; --upper:#F0A24B; --recov:#3CC4B3; --cond:#F472B6; --rest:#94A3B8;
  --good:#4ADE80; --warn:#F0A24B; color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 56px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,9vw,64px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0}
.top p{margin:6px 0 0;color:var(--ink-2);max-width:46ch}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.stat span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* top tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:760px){.week{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px}.week button{flex:0 0 112px;scroll-snap-align:start}}
.day{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;border-radius:10px 10px 0 0;background:var(--c,var(--rest))}
.day small{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.day strong{font-family:var(--f-display);font-size:21px;line-height:1.05;font-weight:600;text-transform:uppercase}
.day em{font-style:normal;font-size:12px;color:var(--ink-2)}
.day[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.day .today{position:absolute;top:10px;right:9px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--c);padding:1px 6px;border-radius:99px}

/* session */
.session{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.s-head{padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.s-head h2{margin:0;font-family:var(--f-display);font-size:clamp(30px,6vw,42px);line-height:1;font-weight:700;text-transform:uppercase}
.s-head h2 span{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.s-note{margin:0;color:var(--ink-2);max-width:70ch}
.group-label{padding:12px 18px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-block:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}

/* exercise rows */
.ex{border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex-h{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:14px 18px}
.ex-h:hover{background:var(--surface-2)}
.ex-n{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.ex-t{display:flex;flex-direction:column;min-width:0}
.ex-t strong{font-weight:600;font-size:16px}
.ex-t span{font-size:13px;color:var(--ink-2)}
.ex-r{display:flex;align-items:center;gap:10px}
.scheme{font-family:var(--f-mono);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);min-width:30px;text-align:right}
.ex.done .prog{color:var(--good)}
.ex-b{padding:2px 18px 20px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px}
@media (max-width:760px){.ex-b{grid-template-columns:minmax(0,1fr)}.ex-h{padding-inline:14px}}
.fig{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;max-width:100%}
.phase{position:absolute;left:10px;top:10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.info h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.avoid{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.avoid li{padding-left:22px;position:relative}
.avoid li::before{content:"";position:absolute;left:3px;top:.55em;width:10px;height:2px;background:var(--cond);transform:rotate(45deg);box-shadow:0 0 0 0 var(--cond)}
.avoid li::after{content:"";position:absolute;left:3px;top:.55em;width:10px;height:2px;background:var(--cond);transform:rotate(-45deg)}
.load{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.load .big{font-family:var(--f-mono);font-size:24px;font-weight:500;color:var(--accent)}
.load small{color:var(--ink-2);flex:1 1 180px;min-width:0}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.sets button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono)}
.sets button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.eq{font-size:13px;color:var(--ink-2)}
.eq b{color:var(--ink);font-weight:600}

/* figure drawing */
.floor{stroke:var(--line);stroke-width:2}
.st{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.st2{stroke:var(--ink-2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.55}
.hd{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.eqs{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft)}
.eql{stroke:var(--accent);stroke-width:3;stroke-linecap:round;fill:none}
.cab{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.fur{fill:var(--line);stroke:none}
.furl{stroke:var(--line);stroke-linecap:round;fill:none}

/* weights view */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-family:var(--f-display);font-size:30px;font-weight:700;text-transform:uppercase;line-height:1}
.panel p{margin:0;color:var(--ink-2);max-width:70ch}
.form{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:120px}
.ramp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.ramp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ramp div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.ramp b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.ramp span{font-size:12.5px;color:var(--ink-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);white-space:nowrap}
tr.grp td{background:var(--surface-2);font-weight:600;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
td small{display:block;color:var(--ink-2)}
.check{background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:600;color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rules div{background:var(--surface-2);border-radius:10px;padding:12px}
.rules b{display:block;margin-bottom:2px}
.rules span{font-size:13.5px;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
#view{display:flex;flex-direction:column;gap:20px}

/* diet view */
.day .kc{font-family:var(--f-mono);font-size:19px;font-weight:500;color:var(--ink);line-height:1.2;margin-top:2px}
.day .kc small{font-size:11px;letter-spacing:.04em;color:var(--ink-2)}
.day .track{height:5px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.day .track i{display:block;height:100%;background:var(--c);border-radius:99px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.bigk{font-family:var(--f-display);font-weight:700;font-size:clamp(64px,14vw,96px);line-height:.9;color:var(--c)}
.bigk small{font-size:.32em;letter-spacing:.04em;color:var(--ink-2);margin-left:6px}
.meter{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .25s}
.mrow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:6px 12px;align-items:center;margin-bottom:10px}
.mrow:last-child{margin-bottom:0}
.mrow b{font-size:13px;font-weight:600}
.mrow .bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:99px;background:var(--m)}
.mrow span{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.mrow em{grid-column:2/4;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:-4px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.pill.ok{background:var(--good);color:var(--bg)}
.pill.warn{background:var(--warn);color:var(--bg)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px}
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:52px 18px minmax(0,1fr);gap:0 12px;position:relative}
.ev .tm{font-family:var(--f-mono);font-size:14px;padding-top:12px;color:var(--ink-2);text-align:right}
.ev .rail{position:relative}
.ev .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.ev:first-child .rail::before{top:18px}
.ev:last-child .rail::before{bottom:calc(100% - 18px)}
.ev .rail i{position:absolute;left:3px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.ev.train .rail i{background:var(--c);border-radius:3px}
.ev.smoke .rail i{background:repeating-linear-gradient(45deg,var(--rest) 0 2px,var(--surface) 2px 4px);border:1.5px solid var(--rest)}
.ev.sleep .rail i,.ev.wake .rail i{background:var(--ink-2)}
.ev .body{padding:8px 0 12px;min-width:0}
.ev .ttl{font-weight:600;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.ev .ttl small{font-weight:400;color:var(--ink-2);font-size:13px}
.ev .sub{color:var(--ink-2);font-size:13.5px;max-width:64ch}
.ev.smoke .ttl{color:var(--ink-2)}
.card{margin-top:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card.eaten{opacity:.62}
.card .top2{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px}
.card h4{margin:0;font-size:16px;font-weight:600}
.card .nums{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.card ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 20px}
.card li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0;font-size:14px}
.card li b{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.card li.sc b{color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--m)}
tr.on td{background:var(--accent-soft)}
.tally{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tally .n{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.tally .btn{width:44px;height:44px;font-size:20px;padding:0}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lists ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.lists li{padding-left:16px;position:relative}
.lists li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--good)}
.lists .no li::before{background:var(--cond)}
.lists li b{display:block}
.lists li span{color:var(--ink-2);font-size:14px}
</script><script type="text/plain" id="app-fuel-html">

    </div>

      <div><b id="st-avg">2,580 kcal</b><span>Average per day</span></div>

    <button id="t-pat" role="tab" aria-selected="false">Eating patterns</button>
    <button id="t-smoke" role="tab" aria-selected="false">Smoking</button>
  </div>
  <main id="view"></main>
</div>
