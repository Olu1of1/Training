      fld('bw', 'Bodyweight (kg)', '<input id="bw" type="number" inputmode="decimal" min="40" max="150" step="0.5" value="' + S.bw + '">') +
      fld('adj', 'Calorie adjustment', '<select id="adj">' + adjOpts + '</select>') + fld('phase', 'Smoking phase', '<select id="phase">' + phOpts + '</select>') + '</div></section>';
    var note = res.scale >= 1.8 ? '<p class="s-note">These meals cannot reach the target on their own. Add an extra snack or choose bigger meals.</p>' : res.scale <= 0.5 ? '<p class="s-note">The target is lower than these meals. Swap to lighter options.</p>' : '';
    var hero = '<section class="panel hero" style="--c:' + c + '"><div><div class="lab">' + day.name + ' · ' + day.title + '</div><div class="bigk">' + num(res.target) + '<small>kcal</small></div>' +
      '<p>' + esc(day.note) + '</p><div class="meter" role="img" aria-label="Eaten so far"><i style="width:' + Math.min(100, round(eatenK / res.target * 100)) + '%"></i></div>' +
      '<div class="mono">Planned ' + num(tot.k) + ' · Eaten ' + num(eatenK) + ' of ' + num(res.target) + '</div>' + note + '</div><div>' +
      macroRow('Protein', tot.P, tot.P * 4 / tot.k * 100, 'var(--lower)', 'Aim for ' + pmin + ' g or more ', '<span class="pill ' + (pOk ? 'ok' : 'warn') + '">' + (pOk ? 'On target' : 'Low') + '</span>') +
      macroRow('Carbs', tot.C, tot.C * 4 / tot.k * 100, 'var(--upper)', (tot.C / S.bw).toFixed(1) + ' g per kg. Higher on leg days, lower on rest days.', '') +
      macroRow('Fat', tot.F, tot.F * 9 / tot.k * 100, 'var(--recov)', 'Healthy range ' + fmin + ' to ' + fmax + ' g ', '<span class="pill ' + (fOk ? 'ok' : 'warn') + '">' + (fOk ? 'In range' : (tot.F > fmax ? 'High' : 'Low')) + '</span>') +
      '</div></section>';
    var tl = timeline(day).map(function (e) {
      var tm = '<div class="tm">' + fmt(e.t) + '</div><div class="rail"><i></i></div>';
      if (e.type === 'meal') return '<li class="ev meal">' + tm + '<div class="body"><div class="ttl">' + SLOT_NAMES[e.slot] + (e.q ? ' <small>' + e.q + '</small>' : '') + '</div>' + mealCard(day, e.slot, res) + '</div></li>';
      return '<li class="ev ' + e.type + '"' + (e.type === 'train' ? ' style="--c:' + c + '"' : '') + '>' + tm + '<div class="body"><div class="ttl">' + esc(e.title) + (e.small ? ' <small>' + esc(e.small) + '</small>' : '') + '</div><div class="sub">' + esc(e.sub) + '</div></div></li>';
    }).join('');
    return settings + '<div class="week" role="group" aria-label="Calories by day">' + strip + '</div>' + hero +
      '<section class="session" style="--c:' + c + '"><div class="s-head"><h2><span>' + day.name + '</span> · timeline</h2><p class="s-note">Meals, training, smoking windows and sleep in order. Carb amounts in blue are scaled to hit the day\'s target. Calories are estimates, so treat them as a guide and adjust by the scale each week.</p></div><ol class="tl" style="padding:14px 18px 6px">' + tl + '</ol></section>';
  }
  function fld(id, label, input) { return '<div class="field"><label for="' + id + '">' + label + '</label>' + input + '</div>'; }

  /* ---- foods view ---- */
  function foodsView() {
    var chips = Object.keys(CATS).map(function (k) { return '<button data-cat="' + k + '" aria-pressed="' + (S.cat === k) + '">' + CATS[k] + '</button>'; }).join('');
    var col = { protein: 'var(--lower)', carb: 'var(--upper)', fat: 'var(--recov)', veg: 'var(--good)' };
    var rows = PANTRY.filter(function (r) { return S.cat === 'all' || r[0] === S.cat; }).map(function (r) {
      return '<tr><td><span class="dot" style="--m:' + col[r[0]] + '"></span><b>' + esc(r[1]) + '</b><small>' + esc(r[5]) + '</small></td><td>' + esc(r[2]) + '</td><td class="num">' + r[3] + '</td><td class="num">' + r[4] + ' g</td></tr>';
    }).join('');
    var lim = LIMIT.map(function (r) { return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
    return '<section class="panel"><h2>What to eat</h2><p>Everything in your daily plan comes from this list. Portions are what you eat, and calories are for that portion. Most of these cost little and are easy to find in Lagos markets.</p>' +
      '<div class="fchips" role="group" aria-label="Filter foods">' + chips + '</div><div class="tbl"><table><thead><tr><th>Food</th><th>Portion</th><th>kcal</th><th>Protein</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
      '<section class="panel"><h2>Limit these</h2><p>You do not have to ban any of them. They just take up calories that could build muscle, so keep them occasional.</p><div class="tbl"><table><thead><tr><th>Food</th><th>Why</th><th>Do this instead</th></tr></thead><tbody>' + lim + '</tbody></table></div></section>';
  }

  /* ---- patterns view ---- */
  function patternsView() {
    function li(a) { return '<li><b>' + esc(a[0]) + '</b><span>' + esc(a[1]) + '</span></li>'; }
    var adj = ADJUST.map(function (r) { return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td></tr>'; }).join('');
    return '<section class="panel"><h2>Eating patterns</h2><p>Your frame is slim, so the hard part is eating enough, regularly. These habits make 2,600 kcal feel normal.</p><div class="lists"><div><h3 style="margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--good)">Do</h3><ul>' + INCLUDE.map(li).join('') + '</ul></div>' +
      '<div class="no"><h3 style="margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cond)">Avoid</h3><ul>' + AVOID.map(li).join('') + '</ul></div></div></section>' +
      '<section class="panel"><h2>Weekly check</h2><p>Every Monday, look at your 3-week trend and use the Calorie adjustment in the Daily plan tab.</p><div class="tbl"><table><thead><tr><th>What you see</th><th>What to do</th></tr></thead><tbody>' + adj + '</tbody></table></div></section>' +
      '<section class="panel"><h2>Extras</h2><div class="rules"><div><b>Creatine, optional</b><span>3 to 5 g a day with water, any time. It is cheap and well studied for strength and muscle.</span></div><div><b>Protein powder, optional</b><span>Only if food leaves you more than 20 g short of your protein target.</span></div><div><b>One flex meal a week</b><span>Pick one meal, such as Saturday dinner, and enjoy it. Return to the plan at the next meal.</span></div></div></section>';
  }

  /* ---- smoking view ---- */
  function smokeView() {
    var ph = PHASES[S.phase], day = DAYS[(new Date().getDay() + 6) % 7];
    var chips = PHASES.map(function (p, i) { return '<button data-phase="' + i + '" aria-pressed="' + (i === S.phase) + '">' + p.label + '</button>'; }).join('');
    var tbl = PHASES.map(function (p, i) {
      return '<tr' + (i === S.phase ? ' class="on"' : '') + '><td><b>' + p.label + '</b></td><td class="num">' + p.cig + '</td><td>' + (p.win.length ? p.win.map(function (w) { return WINDOWS[w].label; }).join(', ') : 'None') + '</td><td class="num">' + p.can + '</td></tr>';
    }).join('');
    var todayWin = timeline(day).filter(function (e) { return e.type === 'smoke'; }).map(function (e) { return '<tr><td class="num">' + fmt(e.t) + '</td><td><b>' + esc(e.title) + '</b>' + (e.small ? '<small>' + esc(e.small) + '</small>' : '') + '</td></tr>'; }).join('');
    var over = S.tally.n - ph.cig, tmsg = S.tally.n === 0 ? 'None yet today.' : over > 0 ? 'Over plan by ' + over + '. That is fine. Reset at the next window and do not try to make up for it.' : over === 0 ? 'On plan for today. The rest of the day is smoke-free.' : (-over) + ' left in your plan today.';
    return '<section class="panel"><h2>Smoking plan</h2><p>The plan fits your cigarettes into set windows and cuts them down in steps. Pick the phase you are in. Windows move with your meal and training times.</p>' +
      '<div class="fchips" role="group" aria-label="Smoking phase">' + chips + '</div><div class="tbl"><table><thead><tr><th>Phase</th><th>Cigarettes a day</th><th>Windows</th><th>Cannabis, one evening session</th></tr></thead><tbody>' + tbl + '</tbody></table></div></section>' +
      '<section class="panel"><h2>Today, ' + day.name + '</h2><div class="tbl"><table><thead><tr><th>Time</th><th>Window</th></tr></thead><tbody>' + todayWin + '</tbody></table></div>' +
      '<div class="tally"><div class="n" id="tn">' + S.tally.n + '</div><button class="btn" data-tally="-1" aria-label="Remove one">−</button><button class="btn" data-tally="1" aria-label="Add one">+</button><div id="tm"><b>Cigarettes today</b><br><span style="color:var(--ink-2)">' + tmsg + '</span></div></div></section>' +
      '<section class="panel"><h2>Rules that protect your training</h2><div class="rules">' +
      '<div><b>Nothing 60 minutes before training</b><span>Nicotine tightens blood vessels and smoke carries carbon monoxide, which means less oxygen to working muscle.</span></div>' +
      '<div><b>Wait 30 minutes after training</b><span>Eat your post-training meal and drink water first. Your body is repairing.</span></div>' +
      '<div><b>Eat before the first one</b><span>Never on an empty stomach and never straight after waking.</span></div>' +
      '<div><b>Wait 10 minutes when an urge hits</b><span>Drink water or walk. Most urges fade in 5 to 10 minutes.</span></div>' +
      '<div><b>Cannabis only in the evening</b><span>One session after dinner, at least 2 hours before bed. It raises hunger, so the plated evening snack comes right after. Never before training.</span></div>' +
      '<div><b>A slip is not a failure</b><span>Go back to the next window. Do not skip a meal to make up for it.</span></div></div>' +
      '<p>If you want help cutting down, a pharmacist can advise on nicotine gum or patches. Expect your appetite to rise as you cut back, which the calorie plan already covers.</p></section>';
  }

  /* ---- render and events ---- */
  function stats() {
    var s = 0; DAYS.forEach(function (d) { s += targetFor(d, S.bw, S.adj); });
    $('#st-avg').textContent = num(s / 7) + ' kcal'; $('#st-pro').textContent = round(S.bw * 1.85 / 5) * 5 + ' g+';
  }
  function render() {
    ['plan', 'food', 'pat', 'smoke'].forEach(function (t) { $('#t-' + t).setAttribute('aria-selected', String(S.tab === t)); });
    view.innerHTML = S.tab === 'plan' ? planView() : S.tab === 'food' ? foodsView() : S.tab === 'pat' ? patternsView() : smokeView();
    stats();
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    if (t.id && t.id.indexOf('t-') === 0) { S.tab = t.id.slice(2); render(); return; }
    var a = t.getAttribute('data-day'); if (a != null) { S.day = +a; render(); return; }
    a = t.getAttribute('data-swap');
    if (a) { var p = S.picks[DAYS[S.day].k]; p[a] = (p[a] + 1) % MEALS[a].length; save(); render(); return; }
    a = t.getAttribute('data-ate');
    if (a) { var key = DAYS[S.day].k + ':' + a; S.ate.d[key] = !S.ate.d[key]; save(); render(); return; }
    a = t.getAttribute('data-cat'); if (a) { S.cat = a; render(); return; }
    a = t.getAttribute('data-phase'); if (a != null) { S.phase = +a; save(); render(); return; }
    a = t.getAttribute('data-tally'); if (a) { S.tally.n = Math.max(0, S.tally.n + (+a)); save(); render(); }
  });
  document.addEventListener('change', function (ev) {
    var id = ev.target.id, v = ev.target.value;
    if (id === 'bw') { var n = parseFloat(v); if (!(n >= 40 && n <= 150)) return; S.bw = n; }
    else if (id === 'adj') S.adj = +v;
    else if (id === 'phase') S.phase = +v;
    else if (id === 'wake' || id === 'eve' || id === 'sat' || id === 'bed') { if (!v) return; S[id] = v; }
    else return;
    save(); render();
  });
  render();
})();
</script>
<script>
(function () {
  var APPS = [{"id":"pitch","name":"Return to Pitch","tab":"Pitch","fonts":["https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"]},{"id":"strength","name":"Strength & Mobility","tab":"Strength","fonts":["https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"]},{"id":"size","name":"Size Block","tab":"Size","fonts":["https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"]},{"id":"home","name":"Home Gym","tab":"Home","fonts":["https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"]},{"id":"fuel","name":"Fuel for the Pitch","tab":"Fuel","fonts":["https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"]}], ICONS = {
    pitch: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7l-1.5-4.4z"/><path d="M12 3v4.5M20.5 9.7l-4.7.6M17.5 19l-3.2-4.3M6.5 19l3.2-4.3M3.5 9.7l4.7.6"/>',
    strength: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
    size: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/><path d="M14 4l3 3 4-4"/>',
    home: '<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
    fuel: '<path d="M12 8c-2.6-2-7 0-7 5 0 4 3 7 5 7 1 0 1.4-.5 2-.5s1 .5 2 .5c2 0 5-3 5-7 0-5-4.4-7-7-5z"/><path d="M12 8c0-2 .8-3.6 2.6-4.4"/>'
  };
  var gen = 0, cur = null, root = document.getElementById('app'), nav = document.getElementById('hub-nav');
  var styleEl = document.createElement('style'); styleEl.id = 'app-css'; document.head.appendChild(styleEl);
  var fontsDone = {};

  /* handlers, timers and animation frames created by an app that is no longer showing become no-ops */
  (function () {
    var dAdd = document.addEventListener, wAdd = window.addEventListener, sI = window.setInterval, sT = window.setTimeout, rAF = window.requestAnimationFrame;
    function wrap(h) { var g = gen; if (typeof h !== 'function') return h; return function () { if (g === gen) return h.apply(this, arguments); }; }
    document.addEventListener = function (t, h, o) { return dAdd.call(document, t, wrap(h), o); };
    window.addEventListener = function (t, h, o) { return wAdd.call(window, t, wrap(h), o); };
    window.setInterval = function (h, ms) { return sI.call(window, wrap(h), ms); };
    window.setTimeout = function (h, ms) { return sT.call(window, wrap(h), ms); };
    window.requestAnimationFrame = function (h) { return rAF.call(window, wrap(h)); };
  })();

  function blob(id, part) { var el = document.getElementById('app-' + id + '-' + part); return el ? el.textContent : ''; }
  function addFonts(list) {
    list.forEach(function (href) {
      if (fontsDone[href]) return; fontsDone[href] = 1;
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l);
    });
  }
  function find(id) { for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }

  function mount(id) {
    var a = find(id) || APPS[0]; if (cur === a.id) return;
    gen++; cur = a.id;
    addFonts(a.fonts);
    styleEl.textContent = blob(a.id, 'css');
    root.innerHTML = blob(a.id, 'html');
    try { (new Function(blob(a.id, 'js')))(); }
    catch (e) { root.insertAdjacentHTML('afterbegin', '<p style="padding:16px">This plan could not start: ' + String(e.message).replace(/</g, '&lt;') + '</p>'); }
    try { localStorage.setItem('hub.last', a.id); } catch (e) {}
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) {
      if (b.dataset.id === a.id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    document.title = a.name;
    window.scrollTo(0, 0);
  }

  nav.innerHTML = APPS.map(function (a) {
    return '<button type="button" data-id="' + a.id + '" aria-label="' + a.name + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[a.id] + '</svg><span>' + a.tab + '</span></button>';
  }).join('');
  nav.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var id = b.dataset.id;
    if (location.hash.slice(1) !== id) { try { location.hash = id; } catch (e) { mount(id); } } else { window.scrollTo(0, 0); }
    mount(id);
  });
  window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (find(id)) mount(id); });

  var start = location.hash.slice(1), last = null;
  try { last = localStorage.getItem('hub.last'); } catch (e) {}
  mount(find(start) ? start : find(last) ? last : 'pitch');
})();

</script>
